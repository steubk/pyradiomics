name: Build prebuilt wheels (no PyPI upload)

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set local version (PEP 440 local segment, PyPI-rejecting)
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=3.1.0+py312fix.${GITHUB_SHA::7}" >> $GITHUB_ENV
      - uses: pypa/cibuildwheel@v3.0
        # build matrix / skip patterns letti da [tool.cibuildwheel] in pyproject.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  publish_release:
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Recreate prebuilt release (clean asset list)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prebuilt-fix-py312 \
            --repo ${{ github.repository }} --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-fix-py312
          target_commitish: prebuilt/py312
          name: "Prebuilt wheels — pyradiomics Python 3.12 fixes (transient)"
          body: |
            **Unofficial prebuilt wheels** of pyradiomics with Python 3.12 compatibility fixes,
            for use during AIM-Harvard/pyradiomics PR review (see https://github.com/AIM-Harvard/pyradiomics/issues/949).

            Install:
            ```
            pip install --find-links https://github.com/steubk/pyradiomics/releases/expanded_assets/prebuilt-fix-py312 pyradiomics
            ```
            Wheels are versioned `3.1.0+py312fix.<sha>` (PEP 440 local segment).
            **This release will be deleted when the upstream PR merges.** Migrate to
            `pip install pyradiomics>=A.B.C` at that point.
          prerelease: true
          files: dist/*.whl
          fail_on_unmatched_files: false
